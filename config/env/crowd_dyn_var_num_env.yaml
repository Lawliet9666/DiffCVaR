defaults:
  - crowd_base
  - _self_

scenario: crowd_dyn_var_num_env
max_steps: 400
safety_margin: 0.05
farthest_dist: 20.0

robot_goal:
  min_distance: ${robot.goal_min_distance}
  max_tries: 100

humans:
  num_humans: 20
  min_num_humans: ${env.humans.num_humans}
  random_num_humans: false
  init_noise_range: 2.0
  vmax: [0.5, 1.5]
  radius: 0.4
  max_tries: 100
  human_policy: social_force
  use_gmm: true
  gmm:
    weights: [0.6, 0.2, 0.2]
    stds: [0.1, 0.2, 0.2]
    lateral_ratio: 0.3
  random_goal_changing: false
  goal_change_chance: 0.0
  end_goal_changing: true
  end_goal_change_chance: 1.0

social_force:
  KI: 3.0
  A: 8.0
  B: 0.2
  avoid_robot: false

reward:
  success_reward: 20.0
  collision_penalty: -20.0
  discomfort_dist: 0.25
  discomfort_penalty_factor: 10.0
  potential_factor: ${robot.reward.potential_factor}
  back_factor: ${robot.reward.back_factor}
  spin_factor: ${robot.reward.spin_factor}
  constant_penalty: -0.025
  boundary_penalty_factor: 0.1
  boundary_buffer: 0.0
